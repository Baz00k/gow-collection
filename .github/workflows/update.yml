name: Update Dependencies

# Two update lanes, each keeping one PR open with native auto-merge:
#
# - deps: scheduled/manual runs of each image's update/check.sh + apply.sh.
# - base-digest: after ci.yml publishes a new base, repin apps to it
#   (.github/scripts/propagate-base-digest.sh).
#
# Update scripts handle upstream-controlled data, so `discover` runs them with a
# read-only token and no secrets, and hands over only the pins.env files they
# changed. `create-pr` runs on a fresh runner, validates those files against the
# committed ones (.github/scripts/validate-pin-changes.sh), and only then mints
# the updater App token. It runs no update scripts and no third-party actions.
# Branch protection's required `ci-gate` check decides when the PR merges.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  repository_dispatch:
    types: [base-digest-published]

permissions:
  contents: read

run-name: "updates: ${{ github.event_name }}"

env:
  LANE: ${{ github.event_name == 'repository_dispatch' && 'base-digest' || 'deps' }}

concurrency:
  group: update-${{ github.event_name == 'repository_dispatch' && 'base-digest' || 'deps' }}
  cancel-in-progress: true

jobs:
  discover:
    name: discover updates
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.collect.outputs.changed }}
    env:
      GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Propagate published base digest
        if: env.LANE == 'base-digest'
        run: bash .github/scripts/propagate-base-digest.sh

      - name: Check and apply dependency updates
        if: env.LANE == 'deps'
        run: |
          set -euo pipefail
          for check_script in images/*/update/check.sh; do
            [[ -x "$check_script" ]] || continue
            image_dir=$(dirname "$(dirname "$check_script")")
            name=$(basename "$image_dir")
            apply_script="${image_dir}/update/apply.sh"
            [[ -x "$apply_script" ]] || { echo "::warning::${name} has check.sh but no apply.sh"; continue; }

            echo "::group::check ${name}"
            tmp=$(mktemp)
            GITHUB_OUTPUT="$tmp" PINS_FILE="${image_dir}/build/pins.env" IMAGE_DIR="$image_dir" bash "$check_script"
            available=$(grep '^update_available=' "$tmp" | cut -d= -f2 || echo false)
            rm -f "$tmp"
            echo "::endgroup::"
            [[ "$available" == "true" ]] || { echo "${name}: up to date"; continue; }

            echo "::group::apply ${name}"
            GITHUB_OUTPUT=/dev/null PINS_FILE="${image_dir}/build/pins.env" IMAGE_DIR="$image_dir" bash "$apply_script"
            echo "::endgroup::"
          done

      - name: Collect changed pins
        id: collect
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/pin-changes"
          mkdir -p "$out"
          git diff --name-only -- 'images/*/build/pins.env' | while IFS= read -r f; do
            mkdir -p "${out}/$(dirname "$f")"
            cp -- "$f" "${out}/${f}"
          done
          if [[ -n "$(find "$out" -type f)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No updates to apply"
          fi

      - name: Upload changed pins
        if: steps.collect.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pin-changes
          path: ${{ runner.temp }}/pin-changes/
          retention-days: 1
          if-no-files-found: error

  create-pr:
    name: create update PR
    needs: discover
    if: needs.discover.outputs.changed == 'true'
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download changed pins
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pin-changes
          path: ${{ runner.temp }}/pin-changes

      - name: Validate and apply changes
        run: |
          set -euo pipefail
          bash .github/scripts/validate-pin-changes.sh "$LANE" "$PWD" "${RUNNER_TEMP}/pin-changes" > "${RUNNER_TEMP}/changes.md"
          git status --short
          {
            if [[ "$LANE" == "base-digest" ]]; then
              echo "## Base Digest Propagation"
            else
              echo "## Dependency Updates"
            fi
            echo
            cat "${RUNNER_TEMP}/changes.md"
            echo "---"
            echo
            echo "*Auto-generated by update workflow*"
          } > "${RUNNER_TEMP}/pr-body.md"
          cat "${RUNNER_TEMP}/pr-body.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.GOW_UPDATER_APP_ID }}
          private-key: ${{ secrets.GOW_UPDATER_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Pushing and opening the PR as the App (not GITHUB_TOKEN) is what makes
      # CI run on the PR.
      - name: Push branch and open PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$LANE" == "base-digest" ]]; then
            branch="auto-update/base-digest"
            title="chore(deps): repin images to new base"
          else
            branch="auto-update/image-pins"
            title="chore(deps): update image pins"
          fi

          bot="${APP_SLUG}[bot]"
          bot_id=$(gh api "users/${bot}" --jq .id)
          git config user.name "$bot"
          git config user.email "${bot_id}+${bot}@users.noreply.github.com"
          git add -- 'images/*/build/pins.env'
          git commit -q -m "$title"
          head=$(git rev-parse HEAD)
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${branch}"

          pr=$(gh pr list --repo "$REPO" --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [[ -n "$pr" ]]; then
            gh pr edit "$pr" --repo "$REPO" --title "$title" --body-file "${RUNNER_TEMP}/pr-body.md"
          else
            url=$(gh pr create --repo "$REPO" --base main --head "$branch" --title "$title" \
              --body-file "${RUNNER_TEMP}/pr-body.md" --label automated --label dependencies)
            pr="${url##*/}"
          fi
          gh pr merge "$pr" --repo "$REPO" --auto --squash --delete-branch --match-head-commit "$head"
          echo "::notice::PR #${pr} at ${head}"
